# Deploy production to Hostinger via plain FTP (lftp).
#
# Required GitHub secrets:
#   FTP_HOST          e.g. ftp.emaraestates.com (or Hostinger FTP hostname)
#   FTP_USERNAME      Hostinger FTP username
#   FTP_PASSWORD      Hostinger FTP password
#   FTP_PORT          21 (plain FTP — not 22/SFTP)
#   FTP_REMOTE_PATH   relative path only. Default/recommended: public_html
#
# Optional mail secrets (written to deploy/.env for PHP — never committed):
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS
#   CONTACT_FROM, CONTACT_TO, RECRUITMENT_EMAIL_TO
# Recruitment prefers PHP mail() on Hostinger; SMTP is the fallback only.
#
# FTP_REMOTE_PATH notes (Hostinger):
#   - Use a path relative to the FTP login root, usually: public_html
#   - If the FTP account is already chrooted into public_html, use: .
#   - Do NOT use absolute system paths like:
#       /home/uXXXXXX/domains/emaraestates.com/public_html
#     Hostinger FTP often cannot cd into those and fails with:
#       550 No such file or directory
#
# Deploy semantics:
#   - Merge web/deploy/ into FTP_REMOTE_PATH (no root delete)
#   - Mirror web/deploy/_next/ with --delete (safe; build-owned)

name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # ubuntu-latest: macos runners recently fail to provision (0 steps / ~4s).
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build, verify, and assemble web/deploy
        working-directory: web
        run: |
          set -euo pipefail
          # check = next build + preservation + smoke + form-parity
          npm run check
          node scripts/deploy-layout.mjs
          node scripts/deploy-check.mjs
          test -f deploy/index.html
          test -d deploy/_next
          # Routing-critical: without these, extensionless URLs and recruitment
          # API fall through to Hostinger's generic 404.
          test -f deploy/.htaccess
          test -f deploy/recruitment.php
          test -f deploy/recruitment-cv.php
          test -d deploy/recruitment-private/cvs
          test -f deploy/contact.html
          test -f deploy/recrutement-commercial-marrakech.html
          test -f deploy/.user.ini

      - name: Write production PHP .env for deploy (no secrets logged)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          RECRUITMENT_EMAIL_TO: ${{ secrets.RECRUITMENT_EMAIL_TO }}
        working-directory: web
        run: |
          set -euo pipefail
          if [ -z "${SMTP_USER:-}" ] && [ -z "${CONTACT_FROM:-}" ] && [ -z "${RECRUITMENT_EMAIL_TO:-}" ]; then
            echo "No mail secrets configured — recruitment will rely on PHP mail() + code defaults."
            exit 0
          fi
          {
            echo "# Generated by CI for Hostinger PHP backends. Do not commit."
            [ -n "${SMTP_HOST:-}" ] && printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            [ -n "${SMTP_PORT:-}" ] && printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
            [ -n "${SMTP_USER:-}" ] && printf 'SMTP_USER=%s\n' "$SMTP_USER"
            [ -n "${SMTP_PASS:-}" ] && printf 'SMTP_PASS=%s\n' "$SMTP_PASS"
            [ -n "${CONTACT_FROM:-}" ] && printf 'CONTACT_FROM=%s\n' "$CONTACT_FROM"
            [ -n "${CONTACT_TO:-}" ] && printf 'CONTACT_TO=%s\n' "$CONTACT_TO"
            [ -n "${RECRUITMENT_EMAIL_TO:-}" ] && printf 'RECRUITMENT_EMAIL_TO=%s\n' "$RECRUITMENT_EMAIL_TO"
          } > deploy/.env
          echo "Wrote deploy/.env for PHP (keys present, values not logged)."
          # Confirm file exists and is non-empty without printing secrets.
          test -s deploy/.env
          wc -c deploy/.env | awk '{print "deploy/.env bytes:", $1}'

      - name: Check FTP secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          # Relative Hostinger path. Never default to a full /home/... system path.
          REMOTE_PATH="${FTP_REMOTE_PATH:-public_html}"

          echo "FTP host: $FTP_HOST"
          echo "FTP port: $FTP_PORT"
          echo "FTP username: $FTP_USERNAME"
          echo "FTP remote path: $REMOTE_PATH"
          echo "FTP password length: ${#FTP_PASSWORD}"

          test -n "${FTP_HOST:-}" || (echo "::error::FTP_HOST secret is missing" && exit 1)
          test -n "${FTP_USERNAME:-}" || (echo "::error::FTP_USERNAME secret is missing" && exit 1)
          test -n "${FTP_PORT:-}" || (echo "::error::FTP_PORT secret is missing. Use 21 for Hostinger FTP." && exit 1)
          if [ "${#FTP_PASSWORD}" -eq 0 ]; then
            echo "::error::FTP_PASSWORD secret is missing or empty"
            exit 1
          fi
          if ! [[ "$FTP_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::FTP_PORT must be a number. Use 21 for Hostinger FTP."
            exit 1
          fi
          if [ "$FTP_PORT" = "22" ]; then
            echo "::error::Port 22 is SFTP. Hostinger FTP uses port 21. Set FTP_PORT=21."
            exit 1
          fi
          if [[ "$REMOTE_PATH" == /* ]]; then
            echo "::error::FTP_REMOTE_PATH must be relative for Hostinger FTP (use public_html or .), not an absolute path like /home/.../public_html."
            exit 1
          fi

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy web/deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        working-directory: web
        run: |
          set -euo pipefail

          HOST="${FTP_HOST}"
          USERNAME="${FTP_USERNAME}"
          PASSWORD="${FTP_PASSWORD}"
          PORT="${FTP_PORT}"
          REMOTE_PATH="${FTP_REMOTE_PATH:-public_html}"
          ATTEMPTS=3

          echo "FTP host: $HOST"
          echo "FTP port: $PORT"
          echo "FTP username: $USERNAME"
          echo "FTP remote path: $REMOTE_PATH"
          echo "FTP password length: ${#PASSWORD}"

          if [ "${#PASSWORD}" -eq 0 ]; then
            echo "::error::FTP_PASSWORD secret is missing or empty"
            exit 1
          fi
          if [[ "$REMOTE_PATH" == /* ]]; then
            echo "::error::FTP_REMOTE_PATH must be relative for Hostinger FTP (use public_html or .), not an absolute path like /home/.../public_html."
            exit 1
          fi

          echo "Probing FTP login directory (pwd + listing)…"
          lftp -u "${USERNAME},${PASSWORD}" -p "${PORT}" "ftp://${HOST}" <<'PROBE'
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 2
          pwd
          cls -la
          bye
          PROBE

          echo "Checking FTP_REMOTE_PATH=${REMOTE_PATH}…"
          if ! lftp -u "${USERNAME},${PASSWORD}" -p "${PORT}" "ftp://${HOST}" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 2
          cd "${REMOTE_PATH}"
          pwd
          bye
          EOF
          then
            echo "::error::FTP_REMOTE_PATH is wrong. Try public_html or ."
            exit 1
          fi

          echo "Deploying web/deploy/ to ${REMOTE_PATH} on ${HOST}:${PORT} via FTP"
          echo "Root merge only (no delete). _next is mirrored with --delete semantics via lftp mirror."

          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "FTP deployment attempt ${attempt}/${ATTEMPTS}"

            COMMAND_FILE="$(mktemp)"
            {
              echo "set cmd:fail-exit yes"
              echo "set ftp:passive-mode true"
              echo "set ftp:ssl-allow no"
              echo "set net:timeout 45"
              echo "set net:max-retries 3"
              echo "set net:reconnect-interval-base 5"
              echo "set net:reconnect-interval-max 30"
              echo "lcd deploy"
              echo "cd \"${REMOTE_PATH}\""

              # 1) Root pages + assets — put only, never delete the document root.
              find deploy -type d -mindepth 1 -not -path 'deploy/_next*' | sort | while IFS= read -r directory; do
                remote_directory="${directory#deploy/}"
                # Hostinger/lftp may return 550 when mkdir -p targets an existing directory.
                # -f makes directory creation idempotent while cmd:fail-exit remains enabled
                # for real upload failures.
                printf 'mkdir -p -f "./%s"\n' "$remote_directory"
              done

              find deploy -type f -not -path 'deploy/_next/*' -not -name 'DEPLOY-MANIFEST.md' | sort | while IFS= read -r file; do
                remote_file="${file#deploy/}"
                remote_directory="$(dirname "$remote_file")"
                if [ "$remote_directory" = "." ]; then
                  printf 'put "%s"\n' "$remote_file"
                else
                  printf 'put -O "./%s" "%s"\n' "$remote_directory" "$remote_file"
                fi
              done

              # 2) _next only — mirror with delete is safe here (owned by the build).
              echo "mirror -R --delete --verbose ./_next ./_next"

              echo "bye"
            } > "$COMMAND_FILE"

            # Pass user AND password in -u so lftp never prompts (GetPass fails in CI).
            if lftp -u "${USERNAME},${PASSWORD}" -p "${PORT}" "ftp://${HOST}" < "$COMMAND_FILE"
            then
              rm -f "$COMMAND_FILE"
              echo "Deployment completed successfully."
              exit 0
            fi

            rm -f "$COMMAND_FILE"

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              sleep_seconds=$((attempt * 20))
              echo "::warning::FTP deployment failed. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "::error::FTP deployment failed after ${ATTEMPTS} attempts. Check FTP_HOST, FTP_PORT (21), FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_PATH (public_html or .) and Hostinger FTP access."
          exit 1
