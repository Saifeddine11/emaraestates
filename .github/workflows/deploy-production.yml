name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install chromium

      - name: Build, verify, and assemble web/deploy
        working-directory: web
        run: |
          set -euo pipefail
          # check = next build + preservation + smoke + form-parity
          npm run check
          node scripts/deploy-layout.mjs
          node scripts/deploy-check.mjs
          test -f deploy/index.html
          test -d deploy/_next

      - name: Check FTP secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          # Prefer FTP_* secrets; fall back to existing SFTP_* names for
          # host/user/password/path. Port defaults to 21 (Hostinger FTP) and
          # never inherits a former SFTP port 22.
          HOST="${FTP_HOST:-${SFTP_HOST:-}}"
          USERNAME="${FTP_USERNAME:-${SFTP_USERNAME:-}}"
          PASSWORD="${FTP_PASSWORD:-${SFTP_PASSWORD:-}}"
          PORT="${FTP_PORT:-21}"
          REMOTE_PATH="${FTP_REMOTE_PATH:-${SFTP_REMOTE_PATH:-/home/u929205898/domains/emaraestates.com/public_html}}"

          test -n "$HOST" || (echo "::error::FTP_HOST (or SFTP_HOST) secret is missing" && exit 1)
          test -n "$USERNAME" || (echo "::error::FTP_USERNAME (or SFTP_USERNAME) secret is missing" && exit 1)
          test -n "$PASSWORD" || (echo "::error::FTP_PASSWORD (or SFTP_PASSWORD) secret is missing" && exit 1)
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::FTP_PORT must be a number. Use 21 for Hostinger FTP."
            exit 1
          fi
          if [ "$PORT" = "22" ]; then
            echo "::error::Port 22 is SFTP. Hostinger FTP uses port 21. Set FTP_PORT=21."
            exit 1
          fi

          echo "FTP host: $HOST"
          echo "FTP port: $PORT"
          echo "FTP remote path: $REMOTE_PATH"

      - name: Install lftp
        run: brew install lftp

      - name: Deploy web/deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        working-directory: web
        run: |
          set -euo pipefail

          HOST="${FTP_HOST:-${SFTP_HOST:-}}"
          USERNAME="${FTP_USERNAME:-${SFTP_USERNAME:-}}"
          PASSWORD="${FTP_PASSWORD:-${SFTP_PASSWORD:-}}"
          PORT="${FTP_PORT:-21}"
          REMOTE_PATH="${FTP_REMOTE_PATH:-${SFTP_REMOTE_PATH:-/home/u929205898/domains/emaraestates.com/public_html}}"
          ATTEMPTS=3

          echo "Deploying web/deploy/ to ${REMOTE_PATH} on ${HOST}:${PORT} via FTP"
          echo "Root merge only (no delete). _next is mirrored with --delete semantics via lftp mirror."

          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "FTP deployment attempt ${attempt}/${ATTEMPTS}"

            COMMAND_FILE="$(mktemp)"
            {
              echo "set cmd:fail-exit yes"
              echo "set ftp:passive-mode true"
              echo "set ftp:ssl-allow no"
              echo "set net:timeout 45"
              echo "set net:max-retries 3"
              echo "set net:reconnect-interval-base 5"
              echo "set net:reconnect-interval-max 30"
              echo "lcd deploy"
              echo "cd \"${REMOTE_PATH}\""

              # 1) Root pages + assets — put only, never delete the document root.
              find deploy -type d -mindepth 1 -not -path 'deploy/_next*' | sort | while IFS= read -r directory; do
                remote_directory="${directory#deploy/}"
                printf 'mkdir -p "./%s"\n' "$remote_directory"
              done

              find deploy -type f -not -path 'deploy/_next/*' -not -name 'DEPLOY-MANIFEST.md' | sort | while IFS= read -r file; do
                remote_file="${file#deploy/}"
                remote_directory="$(dirname "$remote_file")"
                if [ "$remote_directory" = "." ]; then
                  printf 'put "%s"\n' "$remote_file"
                else
                  printf 'put -O "./%s" "%s"\n' "$remote_directory" "$remote_file"
                fi
              done

              # 2) _next only — mirror with delete is safe here (owned by the build).
              echo "mirror -R --delete --verbose ./_next ./_next"

              echo "bye"
            } > "$COMMAND_FILE"

            # Prefer LFTP_PASSWORD so special characters in the password are safe.
            export LFTP_PASSWORD="${PASSWORD}"
            if lftp -u "${USERNAME}" "ftp://${HOST}:${PORT}" < "$COMMAND_FILE"
            then
              rm -f "$COMMAND_FILE"
              echo "Deployment completed successfully."
              exit 0
            fi

            rm -f "$COMMAND_FILE"

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              sleep_seconds=$((attempt * 20))
              echo "::warning::FTP deployment failed. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "::error::FTP deployment failed after ${ATTEMPTS} attempts. Check FTP_HOST, FTP_PORT (21), FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_PATH and Hostinger FTP access."
          exit 1
